# Production stack — build & run without npm on the host:
#   cp .env.prod.example .env.prod   # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: study-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-study}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-study_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-study} -d ${POSTGRES_DB:-study_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: study-assistant-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ${API_IMAGE:-ghcr.io/lxm200806/study_assistant/api:${IMAGE_TAG:-latest}}
    container_name: study-assistant-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # 密码含 @ : / # ? & 时必须自行 URL 编码，因此这里要求显式提供完整 URL
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod and URL-encode the password}
      PORT: "3004"
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      OBJECT_STORAGE_DIR: /app/data/object-store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 只在内网暴露，外部流量统一经 Nginx（TLS/限流/统一入口）
    expose:
      - "3004"
    volumes:
      - tts_cache:/app/data/tts-cache
      - object_store:/app/data/object-store
      # 微信支付商户证书/平台证书（目录已 gitignore，不进入镜像）
      - ./server/certs:/app/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    image: ${WEB_IMAGE:-ghcr.io/lxm200806/study_assistant/web:${IMAGE_TAG:-latest}}
    container_name: study-assistant-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

volumes:
  postgres_data:
  tts_cache:
  object_store:
  redis_data:

networks:
  internal:
    driver: bridge
