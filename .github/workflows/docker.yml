name: CI & Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: study123
          POSTGRES_DB: study_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study -d study_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: "postgresql://study:study123@localhost:5432/study_assistant_test?schema=public"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint backend
        run: npm run lint:server

      - name: Frontend unit tests
        run: npm run test:frontend

      - name: Build H5
        run: npm run build:h5

      - name: Build MP-Weixin
        run: npm run build:mp-weixin

      - name: Check mini-program package size
        run: npm run check:mp-size

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Prisma generate
        working-directory: server
        run: npm run prisma:generate

      - name: API contract types up to date
        run: npm run gen:api && git diff --exit-code src/types/api-generated.ts

      - name: Backend tests (unit + DB integration)
        working-directory: server
        run: npm test

      - name: Backend build
        working-directory: server
        run: npm run build

      - name: Idiom content audit
        working-directory: server
        run: npm run audit:idioms

  e2e-real:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: study123
          POSTGRES_DB: study_assistant_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study -d study_assistant_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://study:study123@localhost:5432/study_assistant_e2e?schema=public"
      JWT_SECRET: "e2e_access_secret_at_least_32_characters_long"
      JWT_REFRESH_SECRET: "e2e_refresh_secret_at_least_32_characters_long"
      E2E_REAL_API: "1"
      E2E_API_BASE: "http://127.0.0.1:3005"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Prisma generate
        working-directory: server
        run: npm run prisma:generate

      - name: Migrate test database
        working-directory: server
        run: node ./node_modules/prisma/build/index.js migrate deploy

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real API E2E
        run: |
          mkdir -p logs
          (cd server && node dist/server.js > ../logs/e2e-api.log 2>&1 &)
          curl --retry 60 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:3005/ready
          npm run test:e2e -- e2e/real-api.spec.ts

      - name: API log on failure
        if: failure()
        run: tail -200 logs/e2e-api.log

  docker:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Extract Web metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
